<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe AI — Your Daily Lifestyle Assistant</title>
  <meta name="description" content="Vibe AI is your personal daily lifestyle chatbot — get movie suggestions, music picks, food ideas, and more based on your mood." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== CSS RESET & ROOT TOKENS ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent-1: #a855f7;
      --accent-2: #6366f1;
      --accent-3: #ec4899;
      --bg-main: #0f0f1a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-input: rgba(255,255,255,0.07);
      --text-primary: #f1f1f8;
      --text-secondary: #9a9ab5;
      --user-bubble: linear-gradient(135deg, #6366f1, #a855f7);
      --bot-bubble: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09);
      --chip-bg: rgba(99,102,241,0.18);
      --chip-border: rgba(168,85,247,0.4);
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --glow: 0 0 40px rgba(168,85,247,0.2);
      --radius: 18px;
      --radius-sm: 10px;
      transition: background 0.3s;
    }

    [data-theme="light"] {
      --bg-main: #f0f0f8;
      --bg-card: rgba(255,255,255,0.7);
      --bg-input: rgba(255,255,255,0.9);
      --text-primary: #1a1a2e;
      --text-secondary: #5a5a8a;
      --bot-bubble: rgba(255,255,255,0.85);
      --border: rgba(0,0,0,0.09);
      --chip-bg: rgba(99,102,241,0.1);
      --chip-border: rgba(168,85,247,0.3);
      --shadow: 0 8px 32px rgba(0,0,0,0.12);
      --glow: 0 0 40px rgba(168,85,247,0.1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(168,85,247,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(236,72,153,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== LAYOUT ===== */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 4px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 18px rgba(168,85,247,0.55);
      animation: float 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .bot-info h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #f0abfc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bot-status {
      font-size: 0.72rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      color: var(--text-secondary);
    }

    .icon-btn:hover {
      background: rgba(168,85,247,0.2);
      border-color: var(--accent-1);
      color: var(--text-primary);
      transform: scale(1.05);
    }

    /* ===== CHAT MESSAGES AREA ===== */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.4); border-radius: 4px; }

    /* ===== MESSAGE BUBBLES ===== */
    .msg-row {
      display: flex;
      gap: 10px;
      animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-top: 2px;
    }

    .msg-avatar.bot-av {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 0 10px rgba(168,85,247,0.4);
    }

    .msg-avatar.user-av {
      background: linear-gradient(135deg, #ec4899, #a855f7);
    }

    .bubble {
      max-width: 72%;
      padding: 13px 16px;
      border-radius: 20px;
      line-height: 1.6;
      font-size: 0.92rem;
      word-break: break-word;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 16px rgba(99,102,241,0.4);
    }

    .bubble .time {
      font-size: 0.65rem;
      opacity: 0.5;
      margin-top: 5px;
      display: block;
    }

    /* ===== CARD STYLE (inside bubbles) ===== */
    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .rec-card {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 12px;
      padding: 12px 14px;
      transition: all 0.2s;
    }

    .rec-card:hover { background: rgba(99,102,241,0.18); transform: translateX(3px); }

    .rec-card .rec-title {
      font-weight: 600;
      font-size: 0.93rem;
      color: #c084fc;
      margin-bottom: 3px;
    }

    .rec-card .rec-meta {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .rec-card .rec-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .tag {
      background: rgba(168,85,247,0.15);
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 0.7rem;
      color: var(--accent-1);
    }

    /* ===== TYPING INDICATOR ===== */
    .typing-row { display: flex; gap: 10px; animation: slideUp 0.3s both; }

    .typing-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent-1);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ===== QUICK CHIPS ===== */
    #chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 4px 6px;
      flex-shrink: 0;
    }

    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 30px;
      padding: 7px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-primary);
      transition: all 0.2s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .chip:hover {
      background: rgba(168,85,247,0.3);
      border-color: var(--accent-1);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(168,85,247,0.25);
    }

    /* ===== INPUT AREA ===== */
    .input-wrap {
      padding: 10px 4px 18px;
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 10px 10px 18px;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus-within {
      border-color: rgba(168,85,247,0.5);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.1);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.93rem;
      font-family: 'Inter', sans-serif;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #user-input::placeholder { color: var(--text-secondary); }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }

    .send-btn:hover { transform: scale(1.07); box-shadow: 0 6px 16px rgba(99,102,241,0.55); }
    .send-btn:active { transform: scale(0.95); }

    .send-btn svg { fill: white; width: 18px; height: 18px; }

    /* ===== WELCOME SCREEN ===== */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 20px;
      flex: 1;
      text-align: center;
    }

    .welcome-icon {
      font-size: 56px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(168,85,247,0.5));
    }

    .welcome h2 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #f0abfc, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      max-width: 380px;
      line-height: 1.6;
    }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .welcome-chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 30px;
      padding: 9px 18px;
      font-size: 0.83rem;
      cursor: pointer;
      color: var(--text-primary);
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      animation: fadeInUp 0.5s both;
    }

    .welcome-chip:nth-child(2) { animation-delay: 0.1s; }
    .welcome-chip:nth-child(3) { animation-delay: 0.2s; }
    .welcome-chip:nth-child(4) { animation-delay: 0.3s; }
    .welcome-chip:nth-child(5) { animation-delay: 0.4s; }
    .welcome-chip:nth-child(6) { animation-delay: 0.5s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .welcome-chip:hover {
      background: rgba(168,85,247,0.25);
      border-color: var(--accent-1);
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(168,85,247,0.25);
    }

    /* ===== CLEAR BUTTON ===== */
    #clear-btn { font-size: 16px; }

    /* ===== USER BADGE ===== */
    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(168,85,247,0.1);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 30px;
      padding: 5px 12px 5px 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .user-badge .user-av {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .user-badge .user-name {
      font-weight: 600;
      color: var(--text-primary);
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 50%;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      color: #fca5a5;
    }

    .logout-btn:hover {
      background: rgba(239,68,68,0.2);
      border-color: rgba(239,68,68,0.5);
      transform: scale(1.05);
    }

    /* Auth loading overlay */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg-main);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      font-size: 0.9rem; color: var(--text-secondary);
    }

    #auth-overlay .spin {
      width: 36px; height: 36px;
      border: 3px solid rgba(168,85,247,0.2);
      border-top-color: var(--accent-1);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .bubble { max-width: 88%; }
      .welcome h2 { font-size: 1.3rem; }
      .user-badge .user-name { max-width: 60px; }
    }
  </style>
</head>
<body>
  <!-- Auth Loading Overlay -->
  <div id="auth-overlay">
    <div class="spin"></div>
    <span>Checking your session…</span>
  </div>

  <div class="app">
    <!-- HEADER -->
    <header>
      <div class="header-left">
        <div class="bot-avatar">✨</div>
        <div class="bot-info">
          <h1>Vibe AI</h1>
          <div class="bot-status">
            <span class="status-dot"></span>
            Your daily lifestyle assistant
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="user-badge" id="user-badge" style="display:none">
          <div class="user-av">😊</div>
          <span class="user-name" id="user-name-display">User</span>
        </div>
        <button class="icon-btn" id="theme-btn" title="Toggle theme">🌙</button>
        <button class="icon-btn" id="clear-btn" title="Clear chat">🗑️</button>
        <button class="logout-btn" id="logout-btn" title="Logout">🚪</button>
      </div>
    </header>

    <!-- CHAT AREA -->
    <div id="chat"></div>

    <!-- QUICK CHIPS -->
    <div id="chips-bar"></div>

    <!-- INPUT -->
    <div class="input-wrap">
      <div class="input-box">
        <textarea id="user-input" rows="1" placeholder="Ask me anything… movies, music, food, mood 🎭"></textarea>
        <button class="send-btn" id="send-btn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    // ===== DATA STORE =====

    };

    const MUSIC = {
      happy: {
        label: "😄 Feeling Happy",
        playlists: [

    const rand = arr => arr[Math.floor(Math.random() * arr.length)];
    const pick = (arr, n=3) => [...arr].sort(() => 0.5 - Math.random()).slice(0, n);

    // ===== INTENT DETECTION =====
    const intents = [
      { name: 'greeting',    re: /\b(hi|hello|hey|howdy|what'?s up|sup|good (morning|evening|afternoon)|yo)\b/i },

    const detectIntent = (text) => {
      for (const intent of intents) {
        if (intent.re.test(text)) return intent.name;
      }
      return 'unknown';
    };

    const JOKES = [
      "Why don't scientists trust atoms? Because they make up everything! 😄",
      "I told my wife she should embrace her mistakes. She gave me a hug. 🤗",
      "Why did the scarecrow win an award? Because he was outstanding in his field! 🌾",
      "I'm reading a book about anti-gravity. It's impossible to put down! 📖",

    ];

    // ===== CONTEXT STATE =====
    let state = {
      awaitingMovieGenre: false,
      awaitingMusicMood: false,
      awaitingFoodType: false,
    };

    // ===== RESPONSE GENERATOR =====
    function generateResponse(userText) {
      const intent = detectIntent(userText);
      const lower = userText.toLowerCase();

      // --- Context continuation ---
      if (state.awaitingMovieGenre) {
        state.awaitingMovieGenre = false;
        const genreMap = {
          action: 'action', comedy: 'comedy', romance: 'romance', 'rom-com': 'romance',
          scifi: 'scifi', 'sci-fi': 'scifi', 'science fiction': 'scifi',
          horror: 'horror', scary: 'horror', animated: 'animated', animation: 'animated',
          cartoon: 'animated', thriller: 'thriller', crime: 'thriller', mystery: 'thriller',
          funny: 'comedy', cute: 'romance',
        };
        let genre = null;
        for (const [key, val] of Object.entries(genreMap)) {
          if (lower.includes(key)) { genre = val; break; }
        }
        if (!genre) genre = rand(Object.keys(MOVIES));
        const picks = pick(MOVIES[genre], 3);
        return buildMovieResponse(picks, genre);
      }

      if (state.awaitingMusicMood) {
        state.awaitingMusicMood = false;
        const moodMap = {
          happy: 'happy', sad: 'sad', blue: 'sad', depressed: 'sad', down: 'sad',
          chill: 'chill', relaxed: 'chill', calm: 'chill', peace: 'chill',
          energetic: 'energetic', hype: 'energetic', pump: 'energetic', workout: 'energetic',
          romantic: 'romantic', love: 'romantic', date: 'romantic',
          focus: 'focus', study: 'focus', work: 'focus', concentrate: 'focus',
        };
        let mood = null;
        for (const [key, val] of Object.entries(moodMap)) {
          if (lower.includes(key)) { mood = val; break; }
        }
        if (!mood) mood = rand(Object.keys(MUSIC));
        const data = MUSIC[mood];
        return buildMusicResponse(data.playlists, data.label, mood);
      }

      if (state.awaitingFoodType) {
        state.awaitingFoodType = false;
        let type = 'hungry';
        if (lower.includes('snack') || lower.includes('light')) type = 'snack';
        if (lower.includes('dessert') || lower.includes('sweet') || lower.includes('cake') || lower.includes('ice cream')) type = 'dessert';
        return buildFoodResponse(FOOD[type]);
      }

      // --- Primary intents ---
      switch (intent) {
        case 'greeting':
          return {
            text: `Hey there! 👋 I'm **Vibe AI**, your personal lifestyle buddy! I can help you with:\n\n🎬 Movie picks\n🎵 Music for your mood\n🍕 Food cravings\n🎮 Activity ideas\n😄 And more!\n\nWhat's on your mind today?`,
            chips: ['🎬 Suggest a movie', '🎵 Music for my mood', '🍕 What should I eat?', '🎮 I\'m bored'],
          };

        case 'howAreYou':
          return {
            text: `I'm doing fantastic — floating on good vibes! ✨\n\nMore importantly, how are **you** feeling right now? Tell me your mood and I'll suggest something perfect — a movie, music, food, or activity to match! 🎭`,
            chips: ['😄 I\'m happy!', '😢 Feeling low', '😴 Just lazy', '⚡ Full of energy'],
          };

        case 'thanks':
          return {
            text: rand([
              "So glad I could help! 🙌 Let me know whenever you need more suggestions!",
              "Anytime! That's what I'm here for 😊 What else can I help you with?",
              "You're very welcome! Enjoy it! 🎉 Need anything else?",
            ]),
            chips: ['🎬 More movies', '🎵 More music', '🍕 Food ideas', '🎮 Activity suggestions'],
          };

        case 'movie': {
          state.awaitingMovieGenre = true;
          return {
            text: `Let's find you the perfect movie! 🎬\n\nWhat kind of mood are you in? Pick a genre or just describe how you feel:`,
            chips: ['🔥 Action', '😂 Comedy', '💕 Romance', '🚀 Sci-Fi', '😱 Horror', '🎨 Animated', '🕵️ Thriller'],
          };
        }

        case 'music': {
          // Check if mood already mentioned
          const moodMap2 = { happy: 'happy', sad: 'sad', chill: 'chill', energetic: 'energetic', romantic: 'romantic', focus: 'focus' };
          let immediateM = null;
          for (const [k, v] of Object.entries(moodMap2)) if (lower.includes(k)) { immediateM = v; break; }
          if (immediateM) {
            const d = MUSIC[immediateM];
            return buildMusicResponse(d.playlists, d.label, immediateM);
          }
          state.awaitingMusicMood = true;
          return {
            text: `Music for your mood — my specialty! 🎵\n\nHow are you feeling right now? Pick your current vibe:`,
            chips: ['😄 Happy', '😢 Sad/Low', '😎 Chill', '⚡ Energetic / Hype', '💕 Romantic', '🎯 Focus/Study'],
          };
        }

        case 'food': {
          // Check if type already mentioned
          if (lower.includes('dessert') || lower.includes('sweet') || lower.includes('cake')) {
            return buildFoodResponse(FOOD.dessert);
          }
          if (lower.includes('snack') || lower.includes('light')) {
            return buildFoodResponse(FOOD.snack);
          }
          state.awaitingFoodType = true;
          return {
            text: `Ooh, talking about food already made me hungry! 🍕\n\nWhat kind of food mood are you in?`,
            chips: ['🍔 Full meal (I\'m starving!)', '🍿 Just a snack', '🍰 Something sweet / dessert'],
          };
        }

        case 'mood': {
          const moodKW = [
            { keys: ['happy', 'great', 'amazing', 'excited', 'fantastic'], mood: 'happy' },
            { keys: ['sad', 'down', 'low', 'depressed', 'lonely', 'upset', 'blue', 'crying'], mood: 'sad' },
            { keys: ['stressed', 'anxious', 'overwhelmed', 'nervous', 'worried'], mood: 'chill' },
            { keys: ['tired', 'sleepy', 'lazy', 'exhausted'], mood: 'chill' },
            { keys: ['bored'], mood: null }, // handle below
            { keys: ['energetic', 'pumped', 'motivated', 'hype'], mood: 'energetic' },
          ];

          if (lower.includes('bored')) {
            const picks = pick(ACTIVITIES, 3);
            return buildActivityResponse(picks, "Boredom? Let's fix that right now! 🎯");
          }

          let detectedMood = null;
          for (const { keys, mood } of moodKW) {
            if (keys.some(k => lower.includes(k))) { detectedMood = mood; break; }
          }

          if (detectedMood) {
            const d = MUSIC[detectedMood];
            const movies = pick(MOVIES[rand(Object.keys(MOVIES))], 2);
            return {
              text: `I feel you 💙 Here's what I'd recommend based on your mood:\n\n**🎵 Music to match your vibe:**`,
              cards: d.playlists.slice(0, 3).map(p => ({ title: p.name, meta: p.meta })),
              suffix: `\n\nWant me to also suggest movies or activities to go with this? 😊`,
              chips: ['🎬 Movie to match', '🎮 Activity ideas', '🍕 Comfort food'],
            };
          }

          return {
            text: `Tell me how you're feeling and I'll match you with the perfect entertainment! Tell me more:\n\nAre you feeling happy, sad, stressed, energetic, or something else? 🎭`,
            chips: ['😄 Happy', '😢 Sad', '😰 Stressed', '⚡ Energetic', '😴 Tired', '💕 Romantic'],
          };
        }

        case 'bored': {
          const picks = pick(ACTIVITIES, 3);
          return buildActivityResponse(picks, "You're bored? Challenge accepted! 🎯");
        }

        case 'weather': {
          let type = lower.includes('rain') || lower.includes('rainy') ? 'rainy' : 'sunny';
          const acts = WEATHER_ACTIVITIES[type];
          return {
            text: `${type === 'rainy' ? '🌧️ Rainy day? Perfect for cozy indoor activities!' : '☀️ Beautiful weather — let\'s make the most of it!'}\n\nHere are some ideas:`,
            simpleList: acts,
            chips: ['🎬 Movie for today', '🍕 Comfort food', '🎵 Matching music'],
          };
        }

        case 'joke':
          return {
            text: `Here's one for you 😄\n\n> *${rand(JOKES)}*\n\nWant another one? Or shall I suggest something fun to do? 😄`,
            chips: ['😄 Another joke!', '🎬 Movie suggestion', '🎮 Fun activity'],
          };

        case 'bye':
          return {
            text: rand([
              "Bye bye! 👋 It was great chatting with you. Come back anytime you need a vibe check! ✨",
              "Take care! 💙 Hope you enjoy whatever you end up watching/listening to. See you soon!",
              "Goodbye! 🌟 Remember — good vibes only. Catch you later! ✨",
            ]),
            chips: [],
          };

        default:
          return {
            text: rand([
              `Hmm, I'm not sure I got that 😅 But I'm great at recommending movies, music, food, and activities! What can I help you with?`,
              `That's an interesting one! 🤔 My specialties are movies 🎬, music 🎵, food 🍕, and activity ideas 🎮. Give one of those a try!`,
              `I'm still learning! 🌱 But I can help you pick what to watch, listen to, eat, or do. What sounds good?`,
            ]),
            chips: ['🎬 Movies', '🎵 Music', '🍕 Food', '🎮 Activities', '😄 Tell me a joke'],
          };
      }
    }

    function buildMovieResponse(picks, genre) {
      return {
        text: `Great taste! Here are some top **${genre.charAt(0).toUpperCase()+genre.slice(1)}** picks for you 🎬`,
        cards: picks.map(m => ({ title: `${m.title} (${m.year})`, meta: `⭐ ${m.rating}`, tags: m.tags })),
        suffix: '\n\nWant a different genre or more suggestions?',
        chips: ['🔄 Different genre', '🎬 More picks', '🎵 Music to go with it', '🍿 Snack ideas'],
      };
    }

    function buildMusicResponse(playlists, label, mood) {
      return {
        text: `Here's your **${label}** playlist lineup 🎵\n\nThese will hit just right:`,
        cards: playlists.slice(0, 4).map(p => ({ title: p.name, meta: p.meta })),
        suffix: '\n\nEnjoy the music! 🎧 Just search these on Spotify, YouTube Music, or Apple Music.',
        chips: ['🔄 Different mood', '🎬 Movie to go with', '🍕 Snack ideas', '😄 Tell me a joke'],
      };
    }

    function buildFoodResponse(items) {
      return {
        text: `Here are some delicious picks for you! 🤤`,
        cards: items.slice(0, 4).map(f => ({ title: f.name, meta: f.meta })),
        suffix: '\n\nEnjoy your meal! 😋 Need a movie or music to go with it?',
        chips: ['🎬 Movie to eat with', '🎵 Dinner music', '🔄 Different food', '🍰 I want dessert!'],

    function buildActivityResponse(picks, intro) {
      return {
        text: intro,
        cards: picks.map(a => ({ title: a.name, meta: a.meta, tags: a.tags })),
        suffix: '\n\nWant more ideas or something more specific?',
        chips: ['🔄 More activities', '🎬 Movie instead', '🎵 Music to start with', '🍕 Snack time'],

    // ===== DOM HELPERS =====
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('user-input');
    const chipsBar = document.getElementById('chips-bar');
    let welcomeEl = null;

    const defaultChips = ['🎬 Suggest a movie', '🎵 Music for my mood', '🍕 What to eat?', '🎮 I\'m bored', '😄 Tell me a joke'];

    function renderChips(chips) {
      chipsBar.innerHTML = '';
      const list = chips && chips.length ? chips : defaultChips;
      list.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = label;
        btn.addEventListener('click', () => sendMessage(label));
        chipsBar.appendChild(btn);
      });
    }

    function addMessage({ role, text, cards, suffix, simpleList, chips, time }) {
      if (welcomeEl) { welcomeEl.remove(); welcomeEl = null; }

      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const av = document.createElement('div');
      av.className = `msg-avatar ${role === 'bot' ? 'bot-av' : 'user-av'}`;
      av.textContent = role === 'bot' ? '✨' : '😊';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      // Render markdown-ish text
      const mdText = (text || '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      const p = document.createElement('div');
      p.innerHTML = mdText;
      bubble.appendChild(p);

      if (simpleList) {
        const ul = document.createElement('ul');
        ul.style.cssText = 'margin-top:10px;padding-left:18px;display:flex;flex-direction:column;gap:5px;';
        simpleList.forEach(item => {
          const li = document.createElement('li');
          li.style.cssText = 'font-size:0.88rem;color:var(--text-primary);';
          li.textContent = item;
          ul.appendChild(li);
        });
        bubble.appendChild(ul);
      }

      if (cards && cards.length) {
        const grid = document.createElement('div');
        grid.className = 'card-grid';
        cards.forEach(card => {
          const c = document.createElement('div');
          c.className = 'rec-card';
          c.innerHTML = `<div class="rec-title">${card.title}</div><div class="rec-meta">${card.meta || ''}</div>`;
          if (card.tags) {
            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'rec-tags';
            card.tags.forEach(t => {
              const tag = document.createElement('span');
              tag.className = 'tag';
              tag.textContent = t;
              tagsDiv.appendChild(tag);
            });
            c.appendChild(tagsDiv);
          }
          grid.appendChild(c);
        });
        bubble.appendChild(grid);
      }

      if (suffix) {
        const sfx = document.createElement('div');
        sfx.style.cssText = 'margin-top:8px;font-size:0.85rem;opacity:0.75;';
        sfx.innerHTML = suffix.replace(/\n/g, '<br>');
        bubble.appendChild(sfx);
      }

      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = time || getTime();
      bubble.appendChild(t);

      if (role === 'bot') {
        row.appendChild(av);
        row.appendChild(bubble);
      } else {
        row.appendChild(bubble);
        row.appendChild(av);
      }

      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;

      if (chips !== undefined) renderChips(chips);
      return row;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing';
      row.innerHTML = `
        <div class="msg-avatar bot-av">✨</div>
        <div class="typing-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>`;
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      addMessage({ role: 'user', text });

      showTyping();
      // Simulate thinking time
      const delay = 600 + Math.random() * 800;
      await new Promise(r => setTimeout(r, delay));
      removeTyping();

      const response = generateResponse(text);
      addMessage({ role: 'bot', ...response });
      saveHistory();
    }

    // ===== EVENT LISTENERS =====
    document.getElementById('send-btn').addEventListener('click', () => sendMessage(inputEl.value));

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(inputEl.value);
      }
    });

    inputEl.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // Theme toggle
    const themeBtn = document.getElementById('theme-btn');
    let isDark = true;
    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? '🌙' : '☀️';
    });

    // Clear chat
    document.getElementById('clear-btn').addEventListener('click', () => {
      chatEl.innerHTML = '';
      localStorage.removeItem('vibe_chat');
      state = { awaitingMovieGenre: false, awaitingMusicMood: false, awaitingFoodType: false };
      showWelcome();
      renderChips([]);
    });

    // ===== PERSISTENCE =====
    function saveHistory() {
      const msgs = [];
      chatEl.querySelectorAll('.msg-row').forEach(row => {
        const role = row.classList.contains('user') ? 'user' : 'bot';
        const bubble = row.querySelector('.bubble');
        msgs.push({ role, html: bubble.innerHTML });
      });
      try { localStorage.setItem('vibe_chat', JSON.stringify(msgs)); } catch(e) {}
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem('vibe_chat');
        if (!raw) return false;
        const msgs = JSON.parse(raw);
        if (!msgs.length) return false;
        msgs.forEach(({role, html}) => {
          const row = document.createElement('div');
          row.className = `msg-row ${role}`;
          const av = document.createElement('div');
          av.className = `msg-avatar ${role === 'bot' ? 'bot-av' : 'user-av'}`;
          av.textContent = role === 'bot' ? '✨' : '😊';
          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          bubble.innerHTML = html;
          if (role === 'bot') { row.appendChild(av); row.appendChild(bubble); }
          else { row.appendChild(bubble); row.appendChild(av); }
          chatEl.appendChild(row);
        });
        chatEl.scrollTop = chatEl.scrollHeight;
        renderChips([]);
        return true;
      } catch(e) { return false; }
    }

    // ===== WELCOME SCREEN =====
    function showWelcome() {
      welcomeEl = document.createElement('div');
      welcomeEl.className = 'welcome';
      welcomeEl.innerHTML = `
        <div class="welcome-icon">✨</div>
        <h2>Hey there! I'm Vibe AI 👋</h2>
        <p>Your personal daily lifestyle assistant — here to help you figure out what to watch, listen to, eat, or do, based on your mood.</p>
        <div class="welcome-chips">
          <button class="welcome-chip" onclick="sendFromWelcome('🎬 Suggest me a movie')">🎬 Suggest a Movie</button>
          <button class="welcome-chip" onclick="sendFromWelcome('🎵 I need music for my mood')">🎵 Music for My Mood</button>
          <button class="welcome-chip" onclick="sendFromWelcome('🍕 What should I eat?')">🍕 Food Ideas</button>
          <button class="welcome-chip" onclick="sendFromWelcome('🎮 I am bored, suggest something fun')">🎮 I\'m Bored!</button>
          <button class="welcome-chip" onclick="sendFromWelcome('😢 I am feeling sad, cheer me up')">😢 Cheer Me Up</button>
          <button class="welcome-chip" onclick="sendFromWelcome('😄 Tell me a joke')">😄 Tell Me a Joke</button>
        </div>`;
      chatEl.appendChild(welcomeEl);
    }

    window.sendFromWelcome = (text) => sendMessage(text);

    // ===== AUTH GUARD =====
    async function initAuth() {
      const token = localStorage.getItem('vibe_token');
      if (!token) {
        window.location.replace('/login.html');
        return;
      }

      try {
        const res = await fetch('/api/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          localStorage.removeItem('vibe_token');
          localStorage.removeItem('vibe_user');
          window.location.replace('/login.html');
          return;
        }

        const data = await res.json();
        const username = data.user?.username || 'friend';

        // Show user info in header
        document.getElementById('user-name-display').textContent = username;
        document.getElementById('user-badge').style.display = 'flex';

        // Update bot greeting
        document.querySelector('.bot-status').innerHTML =
          `<span class="status-dot"></span> Hey, <strong style="color:var(--text-primary)">${username}</strong>! I\'m ready to help ✨`;

      } catch (err) {
        // Network error — allow access if token exists (offline mode)
        const cached = JSON.parse(localStorage.getItem('vibe_user') || '{}');
        if (cached.username) {
          document.getElementById('user-name-display').textContent = cached.username;
          document.getElementById('user-badge').style.display = 'flex';
        }
      } finally {
        // Hide overlay and show app
        document.getElementById('auth-overlay').style.display = 'none';
      }

      // ===== INIT CHAT =====
      if (!loadHistory()) {
        showWelcome();
        renderChips([]);
      }
    }

    // Logout handler
    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('vibe_token');
      if (token) {
        try { await fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {}
      }
      localStorage.removeItem('vibe_token');
      localStorage.removeItem('vibe_user');
      window.location.replace('/login.html');
    });

    initAuth();
  })();
  </script>
</body>
</html>
