name: Local release gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run scan:secrets
      - name: Gitleaks all-history scan (local, redacted)
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl --fail --location --silent --show-error -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$tool_dir/gitleaks" git . --log-opts=--all --redact=100 --no-banner
          "$tool_dir/gitleaks" dir . --redact=100 --no-banner
