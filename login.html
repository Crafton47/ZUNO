<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — ZUNO 2.0</title>
  <meta name="description" content="Sign in to ZUNO 2.0 — your futuristic AI workspace and productivity companion." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080914;
      --surface: #17152D;
      --elevated: #22203A;
      --elevated-soft: #1c1934;
      --violet: #925BFF;
      --violet-deep: #6034c9;
      --cyan: #39E8FF;
      --lime: #D7FF65;
      --pink: #FF73C6;
      --text: #F7F5FF;
      --muted: #B5AED1;
      --border: #373055;
      --border-bright: rgba(57, 232, 255, 0.28);
      --input-bg: rgba(23, 21, 45, 0.85);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --display: 'Space Grotesk', -apple-system, sans-serif;
      --body: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    html, body {
      min-height: 100vh;
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient cyber backdrop */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(800px 500px at 15% 10%, rgba(146, 91, 255, 0.18), transparent 60%),
        radial-gradient(700px 500px at 85% 85%, rgba(57, 232, 255, 0.12), transparent 60%),
        radial-gradient(500px 400px at 50% 50%, rgba(215, 255, 101, 0.04), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Cyber matrix grid overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(146, 91, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(146, 91, 255, 0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(165deg, rgba(34, 32, 58, 0.95), rgba(23, 21, 45, 0.98));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 38px 32px 34px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(146, 91, 255, 0.15);
      animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .brand-orb {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 24px rgba(146, 91, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-title {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .brand-version {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(57, 232, 255, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(57, 232, 255, 0.3);
      letter-spacing: 0.05em;
    }

    .card-eyebrow {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    .card-header h1 {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-header p {
      color: var(--muted);
      font-size: 14px;
    }

    /* Form controls */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 15px;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 42px 0 42px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .input-wrap input::placeholder {
      color: rgba(181, 174, 209, 0.45);
    }

    .input-wrap input:focus {
      border-color: var(--cyan);
      background: rgba(34, 32, 58, 0.95);
      box-shadow: 0 0 0 3px rgba(57, 232, 255, 0.18), 0 0 16px rgba(57, 232, 255, 0.1);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: var(--text);
    }

    .toggle-pass:focus-visible {
      outline: 2px solid var(--cyan);
    }

    /* Options row */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--violet);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--cyan);
    }

    /* Primary Action Button */
    .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--violet) 0%, #7c3aed 100%);
      color: #ffffff;
      font-family: var(--display);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(146, 91, 255, 0.35);
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 26px rgba(146, 91, 255, 0.5), 0 0 12px rgba(57, 232, 255, 0.3);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alerts */
    .alert {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      animation: alertIn 0.25s both;
    }

    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: rgba(255, 115, 198, 0.12);
      border: 1px solid rgba(255, 115, 198, 0.35);
      color: #ff9ed6;
    }

    .alert-success {
      background: rgba(215, 255, 101, 0.12);
      border: 1px solid rgba(215, 255, 101, 0.35);
      color: #e5ff94;
    }

    /* Divider */
    .divider {
      margin: 24px 0 18px;
      text-align: center;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      position: relative;
      background: #191733;
      padding: 0 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* Footer text */
    .footer-text {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .footer-text a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .footer-text a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(57, 232, 255, 0.6);
    }

    .footer-text a:focus-visible {
      outline: 2px solid var(--cyan);
      border-radius: 4px;
    }

    .field-hint {
      font-size: 12px;
      color: var(--pink);
      margin-top: 5px;
      display: none;
    }
  </style>
<link rel="icon" type="image/jpeg" href="/assets/brand/zuno-logo.jpeg"></head>
<body>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <div class="brand-mark">
          <img src="/assets/brand/zuno-logo.jpeg" alt="ZUNO logo" width="84" height="84" style="border-radius:18px;object-fit:contain">
          <span class="brand-title">ZUNO</span>
          <span class="brand-version">2.0</span>
        </div>
        <span class="card-eyebrow">AI COMMAND CENTER</span>
        <h1>Welcome back</h1>
        <p>Sign in to resume your missions & companion space</p>
      </div>

      <div class="alert alert-error" id="error-alert"></div>
      <div class="alert alert-success" id="success-alert"></div>

      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">✉</span>
            <input type="email" id="email" name="email"
                   placeholder="you@domain.com" autocomplete="email" required />
          </div>
          <div class="field-hint" id="email-hint"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">🔒</span>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Toggle password visibility">👁</button>
          </div>
          <div class="field-hint" id="password-hint"></div>
        </div>

        <!-- Options -->
        <div class="options-row">
          <label class="remember-me" for="remember">
            <input type="checkbox" id="remember" name="remember" />
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          <div class="spinner" id="spinner"></div>
          <span id="btn-text">Sign In ↗</span>
        </button>
      </form>

      <div class="divider"><span>New to ZUNO?</span></div>

      <div class="footer-text">
        Need an account? <a href="/register.html">Create your space free ↗</a>
      </div>
    </div>
  </div>

  <script>
    // If already logged in, go to chat
    const existingToken = localStorage.getItem('vibe_token');
    if (existingToken) {
      fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + existingToken } })
        .then(r => r.ok ? window.location.replace('/chat') : null)
        .catch(() => {});
    }

    const form       = document.getElementById('login-form');
    const emailEl    = document.getElementById('email');
    const passEl     = document.getElementById('password');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');
    const spinner    = document.getElementById('spinner');
    const btnText    = document.getElementById('btn-text');
    const loginBtn   = document.getElementById('login-btn');

    // Toggle password visibility
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const isPass = passEl.type === 'password';
      passEl.type = isPass ? 'text' : 'password';
      document.getElementById('toggle-pass').textContent = isPass ? '🔒' : '👁';
    });

    function showError(msg) {
      errorAlert.textContent = '⚠ ' + msg;
      errorAlert.style.display = 'block';
      successAlert.style.display = 'none';
      errorAlert.style.animation = 'none';
      errorAlert.offsetHeight;
      errorAlert.style.animation = '';
    }

    function showSuccess(msg) {
      successAlert.textContent = '✓ ' + msg;
      successAlert.style.display = 'block';
      errorAlert.style.display = 'none';
    }

    function setLoading(on) {
      loginBtn.disabled = on;
      spinner.style.display = on ? 'block' : 'none';
      btnText.textContent = on ? 'Authenticating…' : 'Sign In ↗';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const email    = emailEl.value.trim();
      const password = passEl.value;

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      setLoading(true);

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Login failed.');
          setLoading(false);
          return;
        }

        // Store JWT
        if (document.getElementById('remember').checked) {
          localStorage.setItem('vibe_token', data.token);
          localStorage.setItem('vibe_user', JSON.stringify(data.user));
        } else {
          sessionStorage.setItem('vibe_token', data.token);
          sessionStorage.setItem('vibe_user', JSON.stringify(data.user));
          localStorage.setItem('vibe_token', data.token);
          localStorage.setItem('vibe_user', JSON.stringify(data.user));
        }

        showSuccess('Ready to lock in! Redirecting…');
        setTimeout(() => window.location.replace('/chat'), 600);

      } catch (err) {
        showError('Cannot connect to server. Is it running?');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
